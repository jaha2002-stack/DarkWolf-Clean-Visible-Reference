name: DarkWolf EXP22.9 Dynamic BLAS Budget Release

on:
  workflow_dispatch:
  push:
    branches:
      - exp22-9-dynamic-blas-budget
    paths:
      - '.github/workflows/darkwolf-d3d12-dynamic-blas-budget-exp22_9.yml'
      - 'ci/exp22_9/**'

permissions:
  contents: read

concurrency:
  group: darkwolf-exp22-9-blas-budget-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 180
    steps:
      - name: Checkout exact EXP22.9 kit
        uses: actions/checkout@v4
        with:
          repository: jaha2002-stack/DarkWolf-Clean-Visible-Reference
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          path: kit

      - name: Checkout exact EXP22.8 baseline kit source
        uses: actions/checkout@v4
        with:
          repository: jaha2002-stack/DarkWolf-Clean-Visible-Reference
          ref: ef4c951f2c880e41c88094e937aa91fcc4efea12
          fetch-depth: 1
          persist-credentials: false
          path: exp228kit

      - name: Expand and verify EXP22.8 baseline kit
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Join-Path $env:GITHUB_WORKSPACE 'exp228kit/ci/exp22_8/DarkWolf_EXP22_8_Persistent_Dynamic_SBT_GitHub_Kit.zip'
          $expected = 'F508891F491C4EAACF38BD1E41696FF6F7E8CC52971AF91631EA6EF9F3807754'
          if (-not (Test-Path -LiteralPath $archive -PathType Leaf)) {
            throw "EXP22.8 baseline kit missing at exact commit ef4c951f2c880e41c88094e937aa91fcc4efea12: $archive"
          }
          $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $archive).Hash
          if ($actual -ne $expected) {
            throw "EXP22.8 baseline kit hash mismatch. Expected=$expected Actual=$actual"
          }
          $temp = Join-Path $env:RUNNER_TEMP 'exp22_8-baseline-kit'
          if (Test-Path -LiteralPath $temp) {
            Remove-Item -LiteralPath $temp -Recurse -Force
          }
          New-Item -ItemType Directory -Path $temp -Force | Out-Null
          $tar = (Get-Command tar.exe -ErrorAction Stop).Source
          & $tar -tf $archive | Out-Null
          $listExit = $LASTEXITCODE
          if ($listExit -ne 0) {
            throw "EXP22.8 baseline ZIP validation failed. tar exit code=$listExit"
          }
          & $tar -xf $archive -C $temp
          $extractExit = $LASTEXITCODE
          if ($extractExit -ne 0) {
            throw "EXP22.8 baseline ZIP extraction failed. tar exit code=$extractExit"
          }
          $source = Join-Path $temp 'ci/exp22_8'
          if (-not (Test-Path -LiteralPath $source -PathType Container)) {
            throw "Expanded EXP22.8 payload directory is missing: $source"
          }
          $destination = Join-Path $env:GITHUB_WORKSPACE 'kit/ci/exp22_8'
          if (Test-Path -LiteralPath $destination) {
            Remove-Item -LiteralPath $destination -Recurse -Force
          }
          New-Item -ItemType Directory -Path $destination -Force | Out-Null
          Copy-Item -LiteralPath (Join-Path $source '*') -Destination $destination -Recurse -Force
          foreach ($required in @(
            'apply_exp228.ps1',
            'compile_exp228.ps1',
            'package_exp228.ps1',
            'SOURCE_INPUT_SHA256SUMS.txt',
            'SOURCE_OUTPUT_SHA256SUMS.txt'
          )) {
            $requiredPath = Join-Path $destination $required
            if (-not (Test-Path -LiteralPath $requiredPath -PathType Leaf)) {
              throw "Required EXP22.8 baseline file is missing after extraction: $requiredPath"
            }
          }
          Write-Host "EXP22_8_BASELINE_PAYLOAD=PASS COMMIT=ef4c951f2c880e41c88094e937aa91fcc4efea12 SHA256=$actual EXTRACTOR=bsdtar"

      - name: Checkout exact EXP22.4 donor
        uses: actions/checkout@v4
        with:
          repository: jaha2002-stack/DarkWolf-Clean-Visible-Reference
          ref: 7a5b93de850c2ac2d172af53ac26923fad9af1cd
          fetch-depth: 1
          persist-credentials: false
          path: donor

      - name: Checkout exact Stable Clear v2.2 source
        uses: actions/checkout@v4
        with:
          repository: jaha2002-stack/DarkWolf-Clean-Visible-Reference
          ref: 229cd5d93b4c24ba705c9821a871cccf31b34b96
          fetch-depth: 1
          persist-credentials: false
          path: work

      - name: Recover proven EXP22.4 payload
        shell: pwsh
        run: |
          ./kit/ci/exp22_6/recover_exp224_payload.ps1 `
            -DonorRoot "$env:GITHUB_WORKSPACE/donor" `
            -WorkRoot "$env:GITHUB_WORKSPACE/work"

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Rebuild exact chain through EXP22.4
        shell: pwsh
        working-directory: work
        run: ./scripts/build_exp224.ps1 -Configuration 'Release'

      - name: Apply EXP22.6 lifecycle baseline
        shell: pwsh
        run: |
          ./kit/ci/exp22_6/apply_exact_patch.ps1 `
            -RepositoryRoot "$env:GITHUB_WORKSPACE/kit" `
            -WorkRoot "$env:GITHUB_WORKSPACE/work"

      - name: Apply EXP22.7 incremental SBT baseline
        shell: pwsh
        run: |
          ./kit/ci/exp22_7/apply_exp227.ps1 `
            -RepositoryRoot "$env:GITHUB_WORKSPACE/kit" `
            -WorkRoot "$env:GITHUB_WORKSPACE/work"

      - name: Apply EXP22.8 persistent SBT baseline
        shell: pwsh
        run: |
          ./kit/ci/exp22_8/apply_exp228.ps1 `
            -RepositoryRoot "$env:GITHUB_WORKSPACE/kit" `
            -WorkRoot "$env:GITHUB_WORKSPACE/work"

      - name: Apply EXP22.9 dynamic BLAS budget patch
        shell: pwsh
        run: |
          ./kit/ci/exp22_9/apply_exp229.ps1 `
            -RepositoryRoot "$env:GITHUB_WORKSPACE/kit" `
            -WorkRoot "$env:GITHUB_WORKSPACE/work"

      - name: Compile isolated Release x64 EXP22.9
        shell: pwsh
        run: |
          ./kit/ci/exp22_9/compile_exp229.ps1 `
            -RepositoryRoot "$env:GITHUB_WORKSPACE/kit" `
            -WorkRoot "$env:GITHUB_WORKSPACE/work"

      - name: Package complete EXP22.9 runtime
        shell: pwsh
        run: |
          ./kit/ci/exp22_9/package_exp229.ps1 `
            -RepositoryRoot "$env:GITHUB_WORKSPACE/kit" `
            -WorkRoot "$env:GITHUB_WORKSPACE/work"

      - name: Upload EXP22.9 failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: DarkWolf-Exp22.9-Failure-Diagnostics
          path: |
            work/ci/exp22_6/build_logs/**
            work/ci/exp22_6/BUILD_GRAPH_AUDIT.txt
            work/ci/exp22_9/**
            work/src/opengl/gl_d3d12raylight.cpp
            work/src/opengl/opengl.h
            work/src/renderer/tr_backend.cpp
            work/src/renderer/tr_cmds.cpp
          if-no-files-found: warn
          compression-level: 6
          retention-days: 14

      - name: Upload EXP22.9 production runtime
        uses: actions/upload-artifact@v4
        with:
          name: DarkWolf-Exp22.9-Full-Production-Release
          path: work/release-darkwolf-exp22_9-dynamic-blas-budget/**
          if-no-files-found: error
          compression-level: 6
          retention-days: 30

      - name: Upload EXP22.9 source audit
        uses: actions/upload-artifact@v4
        with:
          name: DarkWolf-Exp22.9-Source-Audit
          path: |
            work/ci/exp22_9/EXP22_9_SOURCE_DIFF.patch
            work/ci/exp22_9/SOURCE_CONTRACT_SUMMARY.txt
            work/ci/exp22_9/SOURCE_INPUT_SHA256SUMS.txt
            work/ci/exp22_9/SOURCE_OUTPUT_SHA256SUMS.txt
            work/ci/exp22_9/EXP22_9_COMPILE_MANIFEST.txt
            work/ci/exp22_9/PATCH_TRANSPORT_AUDIT.txt
            work/ci/exp22_6/BUILD_GRAPH_AUDIT.txt
          if-no-files-found: error
          compression-level: 6
          retention-days: 30
