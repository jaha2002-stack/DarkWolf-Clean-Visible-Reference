          if (-not $hlslBody.Contains($marker)) { throw "Missing Bloom 18.2 HLSL marker: $marker" }
        }
        if (([regex]::Matches($shim, 'finalBloomPyramid\[QD3D12_FinalBloomLevelCount\]')).Count -lt 1) {
          throw 'Four-level pyramid storage is missing.'
        }

