          if (-not ($shim.Contains($marker) -or $ray.Contains($marker) -or $backend.Contains($marker) -or $header.Contains($marker) -or (Get-Content -LiteralPath 'src/renderer/tr_init.cpp' -Raw).Contains($marker))) {
