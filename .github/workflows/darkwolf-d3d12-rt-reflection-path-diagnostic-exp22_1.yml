    - name: Materialize minimal Experiment 19 bridge patch
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'

        function Write-CompressedPayload {
          param([string]$Path,[string]$Sha256,[string]$Data)
          $compressed = [Convert]::FromBase64String($Data)
          $inputStream = [IO.MemoryStream]::new([byte[]]$compressed, $false)
          $outputStream = [IO.MemoryStream]::new()
          try {
            $gzip = [IO.Compression.GZipStream]::new($inputStream, [IO.Compression.CompressionMode]::Decompress, $false)
            try { $gzip.CopyTo($outputStream) } finally { $gzip.Dispose() }
            $bytes = $outputStream.ToArray()
          } finally { $outputStream.Dispose(); $inputStream.Dispose() }
          $parent = Split-Path -Parent $Path
          if ($parent) { New-Item -ItemType Directory -Path $parent -Force | Out-Null }
          [IO.File]::WriteAllBytes($Path, $bytes)
          $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $Path).Hash
          if ($actual -ne $Sha256) { throw "Payload hash mismatch: $Path expected=$Sha256 actual=$actual" }
          Write-Host "Materialized: $Path ($($bytes.Length) bytes)"
        }

        $payloads = @(
          [pscustomobject]@{ Path='work/patches/270-d3d12-game-dynamic-lights-bridge-exp19.patch'; Sha='0D6DE687348D36F4316D58DDB7846A4A56921DB76FDE1DBB84E3DFEE8C542171'; Data='' }
        )
        foreach ($payload in $payloads) { Write-CompressedPayload -Path $payload.Path -Sha256 $payload.Sha -Data $payload.Data }

        Write-Host 'Experiment 19 bridge patch hash: PASSED'
    - name: Setup Python for deterministic tr_scene transformation
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Materialize minimal Experiment 19.1 build payloads
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'

        function Write-CompressedPayload {
          param([string]$Path,[string]$Sha256,[string]$Data)
          $compressed = [Convert]::FromBase64String($Data)
          $inputStream = [IO.MemoryStream]::new([byte[]]$compressed, $false)
          $outputStream = [IO.MemoryStream]::new()
          try {
            $gzip = [IO.Compression.GZipStream]::new($inputStream, [IO.Compression.CompressionMode]::Decompress, $false)
            try { $gzip.CopyTo($outputStream) } finally { $gzip.Dispose() }
            $bytes = $outputStream.ToArray()
          } finally { $outputStream.Dispose(); $inputStream.Dispose() }
          $parent = Split-Path -Parent $Path
          if ($parent) { New-Item -ItemType Directory -Path $parent -Force | Out-Null }
          [IO.File]::WriteAllBytes($Path, $bytes)
          $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $Path).Hash
          if ($actual -ne $Sha256) { throw "Payload hash mismatch: $Path expected=$Sha256 actual=$actual" }
          Write-Host "Materialized: $Path ($($bytes.Length) bytes)"
        }

        $payloads = @(
          [pscustomobject]@{ Path='work/patches/271-d3d12-transient-core-exp19_1.patch'; Sha='3E20411A16C3D9FB5C9CDC0A28EF2E288D0C9435D97D46DD1FFF862C7E3F32FF'; Data='' },
          [pscustomobject]@{ Path='work/scripts/apply_exp19_1_tr_scene.py'; Sha='F6BCE678CBB2081D610DA9AAD7C2D5563CA2887BCB42E7C6A4D86041C7FB8DFD'; Data='' },
          [pscustomobject]@{ Path='work/scripts/apply_exp19_1.ps1'; Sha='8879F28938BDBDBCB98DA15C9E9F2519615CA087A7A0656B1C11CDB7E82BBD91'; Data='' }
        )
        foreach ($payload in $payloads) { Write-CompressedPayload -Path $payload.Path -Sha256 $payload.Sha -Data $payload.Data }

        $powerShellFiles = @('work/scripts/apply_exp19_1.ps1')
        foreach ($powerShellFile in $powerShellFiles) {
          $tokens = $null
          $parseErrors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $powerShellFile),[ref]$tokens,[ref]$parseErrors)
          if ($parseErrors.Count -gt 0) {
            $parseErrors | ForEach-Object { Write-Error $_.Message }
            throw "PowerShell syntax validation failed: $powerShellFile errors=$($parseErrors.Count)"
          }
          Write-Host "PowerShell syntax: PASSED $powerShellFile"
        }

        python -m py_compile 'work/scripts/apply_exp19_1_tr_scene.py'
        if ($LASTEXITCODE -ne 0) { throw 'Python syntax validation failed: work/scripts/apply_exp19_1_tr_scene.py' }
        Write-Host 'Experiment 19.1 build payload hashes and script syntax: PASSED'
    - name: Materialize Experiment 20 Persistent Priority and Hysteresis 
