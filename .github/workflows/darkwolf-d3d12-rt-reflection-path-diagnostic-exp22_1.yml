        )) {
          if (-not ($shim.Contains($marker) -or $ray.Contains($marker) -or $backend.Contains($marker) -or $init.Contains($marker) -or $local.Contains($marker) -or $header.Contains($marker))) {
            throw "Missing Experiment 18.2 marker: $marker"
          }
