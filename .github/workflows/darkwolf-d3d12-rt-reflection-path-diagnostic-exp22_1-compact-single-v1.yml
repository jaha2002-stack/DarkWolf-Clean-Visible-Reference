          $bytes = [Convert]::FromBase64String(($base64 -replace '\s', ''))
          [IO.File]::WriteAllBytes($archive, $bytes)
          $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $archive).Hash
          if ($actual -ne '009C0315CA63705C8CBBDD8ADA95FC38A6957083D70F2FEB82196A1E11A1661D') { throw "Compact payload archive hash mismatch: $actual" }
          Expand-Archive -LiteralPath $archive -DestinationPath 'work' -Force
          Push-Location 'work'
          try {
            foreach ($line in Get-Content -LiteralPath 'PAYLOAD_SHA256SUMS.txt') {
              if ([string]::IsNullOrWhiteSpace($line)) { continue }
              if ($line -notmatch '^([0-9A-F]{64})  (.+)$') { throw "Invalid payload manifest line: $line" }
              $expected = $Matches[1]
              $path = $Matches[2].Replace('/', [IO.Path]::DirectorySeparatorChar)
              if (-not (Test-Path -LiteralPath $path)) { throw "Payload file missing: $path" }
              $fileHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $path).Hash
              if ($fileHash -ne $expected) { throw "Payload hash mismatch: $path" }
            }
          } finally { Pop-Location }
          Write-Host 'EXP22_1_COMPACT_SINGLE_PAYLOAD=PASS'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build and validate Experiment 22.1 compact
        shell: pwsh
        working-directory: work
        run: ./scripts/build_exp221_compact.ps1 -Configuration '${{ inputs.configuration }}'

      - name: Upload compact diagnostic artifact
        uses: actions/upload-artifact@v4
        with:
          name: DarkWolf-Exp22.1-Reflection-Diagnostic-Compact-${{ inputs.configuration }}
          path: work/release-rt-reflection-diagnostic-exp22_1
          if-no-files-found: error
          compression-level: 6
