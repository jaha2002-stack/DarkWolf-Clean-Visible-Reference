name: DarkWolf Experiment 22.3 Hit-Surface Binding Repair

on:
  workflow_dispatch:
    inputs:
      configuration:
        description: Build configuration
        required: true
        default: Release
        type: choice
        options:
          - Release
          - Debug
  push:
    branches:
      - main
      - agent/exp223-hit-surface-binding-repair
    paths:
      - .github/workflows/darkwolf-d3d12-hit-surface-binding-repair-exp22_3.yml

permissions:
  contents: read

concurrency:
  group: darkwolf-exp22-3-hit-surface-binding-repair-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      BUILD_CONFIGURATION: ${{ inputs.configuration || 'Release' }}
    steps:
      - name: Checkout exact Stable Clear v2.2 source
        uses: actions/checkout@v4
        with:
          ref: 229cd5d93b4c24ba705c9821a871cccf31b34b96
          fetch-depth: 1
          path: work

      - name: Verify exact source base
        shell: pwsh
        working-directory: work
        run: |
          $ErrorActionPreference = 'Stop'
          $expected = '229cd5d93b4c24ba705c9821a871cccf31b34b96'
          $actual = (git rev-parse HEAD).Trim().ToLowerInvariant()
          if ($LASTEXITCODE -ne 0 -or $actual -ne $expected) {
            throw "Exact source base mismatch. Expected=$expected Actual=$actual"
          }
          Write-Host "EXP22_3_BASE_COMMIT=$actual"

