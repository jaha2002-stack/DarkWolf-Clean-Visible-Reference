          $bytes = [Convert]::FromBase64String(($base64 -replace '\s', ''))
          [IO.File]::WriteAllBytes($archive, $bytes)
          $actualArchiveHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $archive).Hash
          if ($actualArchiveHash -ne '9FC9FA5D81FE32F42C1F5F8E3FBD6B0151297CBE6CEAC937858B9777C831707D') {
            throw "Experiment 22.3 payload archive hash mismatch: $actualArchiveHash"
          }
          $payloadRoot = Join-Path $env:RUNNER_TEMP 'exp223-payload'
          New-Item -ItemType Directory -Path $payloadRoot -Force | Out-Null
          Expand-Archive -LiteralPath $archive -DestinationPath $payloadRoot -Force
          Push-Location $payloadRoot
          try {
            $manifestPaths = [Collections.Generic.HashSet[string]]::new([StringComparer]::Ordinal)
            foreach ($line in Get-Content -LiteralPath 'PAYLOAD_SHA256SUMS.txt') {
              if ([string]::IsNullOrWhiteSpace($line)) { continue }
              if ($line -notmatch '^([0-9A-F]{64})  (.+)$') {
                throw "Invalid payload manifest line: $line"
              }
              $expected = $Matches[1]
              $relative = $Matches[2]
              if (-not $manifestPaths.Add($relative)) {
                throw "Duplicate payload manifest path: $relative"
              }
              $path = $relative.Replace('/', [IO.Path]::DirectorySeparatorChar)
              if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
                throw "Payload file missing: $path"
              }
              $fileHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $path).Hash
              if ($fileHash -ne $expected) {
                throw "Payload hash mismatch: $path"
              }
            }
            $actualFiles = @(
              Get-ChildItem -Recurse -File |
                ForEach-Object {
                  [IO.Path]::GetRelativePath((Get-Location).Path, $_.FullName).Replace('\','/')
                } |
                Where-Object { $_ -ne 'PAYLOAD_SHA256SUMS.txt' } |
                Sort-Object
            )
            if ($actualFiles.Count -ne $manifestPaths.Count) {
              throw "Payload manifest coverage mismatch. Manifest=$($manifestPaths.Count) Files=$($actualFiles.Count)"
            }
            foreach ($relative in $actualFiles) {
              if (-not $manifestPaths.Contains($relative)) {
                throw "Unlisted payload file: $relative"
              }
            }
          } finally {
            Pop-Location
          }
          $workRoot = (Resolve-Path 'work').Path
          foreach ($entry in Get-ChildItem -LiteralPath $payloadRoot -Force) {
            Copy-Item -LiteralPath $entry.FullName -Destination $workRoot -Recurse -Force
          }
          foreach ($relative in $manifestPaths) {
            $path = $relative.Replace('/', [IO.Path]::DirectorySeparatorChar)
            $sourcePath = Join-Path $payloadRoot $path
            $workPath = Join-Path $workRoot $path
            if (-not (Test-Path -LiteralPath $workPath -PathType Leaf)) {
              throw "Payload copy missing in checkout: $relative"
            }
            $sourceHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $sourcePath).Hash
            $workHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $workPath).Hash
            if ($workHash -ne $sourceHash) {
              throw "Payload copy hash mismatch in checkout: $relative"
            }
          }
          Write-Host "EXP22_3_PAYLOAD_SHA256=$actualArchiveHash"
          Write-Host "EXP22_3_PAYLOAD_FILE_COUNT=$($manifestPaths.Count)"
          Write-Host 'EXP22_3_PAYLOAD_VALIDATION=PASS'

      - name: Validate PowerShell syntax and line endings
        shell: pwsh
        working-directory: work
        run: |
          $ErrorActionPreference = 'Stop'
          $scripts = @(
            'scripts/apply_exp223.ps1',
            'scripts/build_exp223_compact.ps1',
            'scripts/package_exp223.ps1',
            'RT_REFLECTION_HIT_BINDING_REPAIR_EXP22_3_RUN_AND_COLLECT.ps1'
          )
          foreach ($script in $scripts) {
            $tokens = $null
            $errors = $null
            [Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $script), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -ne 0) {
              throw "PowerShell syntax error in $script`: $($errors[0].Message)"
            }
          }
          $patchText = [IO.File]::ReadAllText(
            (Resolve-Path 'patches/330-d3d12-hit-surface-binding-repair-exp22_3.patch'))
          if ($patchText.Contains("`r")) {
            throw 'Experiment 22.3 git patch is not LF-only.'
          }
          foreach ($path in @(
            $scripts +
            'RUN_RT_REFLECTION_HIT_BINDING_REPAIR_EXP22_3.bat' +
            'README_RT_REFLECTION_HIT_BINDING_REPAIR_EXP22_3_RU.txt' +
            'main/game_rt_reflection_hit_binding_repair_exp22_3.cfg' +
            (Get-ChildItem -LiteralPath 'main/exp223' -Filter '*.cfg' -File |
              ForEach-Object { $_.FullName })
          )) {
            $text = [IO.File]::ReadAllText((Resolve-Path $path))
            $withoutCrLf = $text.Replace("`r`n", '')
            if ($withoutCrLf.Contains("`r") -or $withoutCrLf.Contains("`n")) {
              throw "Mixed or non-CRLF line endings: $path"
            }
          }
          $autoChain = [ordered]@{
            'F6'='F7'; 'F7'='F8'; 'F8'='F9'; 'F9'='F10'; 'F10'='F11'; 'F11'='F12'
          }
          foreach ($pair in $autoChain.GetEnumerator()) {
            $path = "main/exp223/$($pair.Key.ToLowerInvariant()).cfg"
            $text = [IO.File]::ReadAllText((Resolve-Path $path))
            $expectedExec = "exec exp223/$($pair.Value.ToLowerInvariant()).cfg"
            if (-not $text.Contains($expectedExec)) {
              throw "Automatic mode chain is broken: $($pair.Key) must execute $($pair.Value)."
            }
          }
          $f12 = [IO.File]::ReadAllText((Resolve-Path 'main/exp223/f12.cfg'))
          foreach ($marker in @(
            'RT_REFLECTION_DIAG_EXP22_3 ALL_MODES_COMPLETE',
            'RT_REFLECTION_DIAG_EXP22_3 AUTO_EXIT',
            'quit'
          )) {
            if (-not $f12.Contains($marker)) {
              throw "F12 automatic completion marker missing: $marker"
            }
          }
          $collector = [IO.File]::ReadAllText(
            (Resolve-Path 'RT_REFLECTION_HIT_BINDING_REPAIR_EXP22_3_RUN_AND_COLLECT.ps1'))
          foreach ($marker in @(
            'YellowPct=$m.YellowPct',
            'RT_REFLECTION_BIND_EXP22_3 active=',
            'RT_REFLECTION_DIAG_EXP22_(?:1|2|3) mode=',
            'BINDING_STATS.csv',
            'F9 native hit-colour coverage is below 90 percent',
            'Write-CollectorFailureArchive',
            'COLLECTOR_ERROR.txt',
            '[switch]$SelfTest'
          )) {
            if (-not $collector.Contains($marker)) {
              throw "Collector repair marker missing: $marker"
            }
          }
          & pwsh -NoLogo -NoProfile -File './RT_REFLECTION_HIT_BINDING_REPAIR_EXP22_3_RUN_AND_COLLECT.ps1' -SelfTest
          if ($LASTEXITCODE -ne 0) {
            throw "Experiment 22.3 collector self-test failed with exit code $LASTEXITCODE."
          }
          Write-Host 'EXP22_3_SYNTAX_AND_LINE_ENDINGS=PASS'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Reconstruct validate compile and package Experiment 22.3
        shell: pwsh
        working-directory: work
        run: ./scripts/build_exp223_compact.ps1 -Configuration $env:BUILD_CONFIGURATION

      - name: Audit packaged release
        shell: pwsh
        working-directory: work
        run: |
          $ErrorActionPreference = 'Stop'
          $release = 'release-rt-reflection-hit-binding-repair-exp22_3'
          if (-not (Test-Path -LiteralPath "$release/WolfSP.exe" -PathType Leaf)) {
            throw 'Packaged WolfSP.exe is missing.'
          }
          if ((Get-Item -LiteralPath "$release/WolfSP.exe").Length -lt 1048576) {
            throw 'Packaged WolfSP.exe is unexpectedly small.'
          }
          $resolved = (Resolve-Path $release).Path
          foreach ($line in Get-Content -LiteralPath "$release/SHA256SUMS.txt") {
            if ($line -notmatch '^([0-9A-F]{64})  (.+)$') {
              throw "Invalid release checksum line: $line"
            }
            $expected = $Matches[1]
            $path = Join-Path $resolved $Matches[2]
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Release file missing: $path"
            }
            $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $path).Hash
            if ($actual -ne $expected) {
              throw "Release checksum mismatch: $path"
            }
          }
          $dlls = @(Get-ChildItem -LiteralPath $release -Recurse -Filter '*.dll' -File)
          if ($dlls.Count -ne 0) {
            throw "Unexpected runtime DLLs: $($dlls.Name -join ', ')"
          }
          Get-ChildItem -LiteralPath $release -Recurse -File |
            Sort-Object FullName |
            ForEach-Object {
              $relative = [IO.Path]::GetRelativePath($resolved, $_.FullName)
              Write-Host ("ARTIFACT_FILE {0} {1}" -f $_.Length, $relative)
            }
          Write-Host 'EXP22_3_PACKAGE_AUDIT=PASS'

      - name: Upload game-ready Experiment 22.3 release
        uses: actions/upload-artifact@v4
        with:
          name: DarkWolf-Exp22.3-Hit-Surface-Binding-Repair-${{ env.BUILD_CONFIGURATION }}
          path: work/release-rt-reflection-hit-binding-repair-exp22_3
          if-no-files-found: error
          compression-level: 6
          retention-days: 30
