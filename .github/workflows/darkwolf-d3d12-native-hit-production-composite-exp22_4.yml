          '@
          [IO.File]::WriteAllBytes(
            $archive,
            [Convert]::FromBase64String(($base64 -replace '\s',''))
          )
          $expected = '2B2A7C867CDA10D6324AC114F0F5F9AEE05D20FAA50341F417F7C87A6330D393'
          $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $archive).Hash
          if ($actual -ne $expected) {
            throw "EXP22.4 payload hash mismatch. Expected=$expected Actual=$actual"
          }
          Expand-Archive -LiteralPath $archive -DestinationPath . -Force
          $manifest = 'PAYLOAD_SHA256SUMS.txt'
          if (-not (Test-Path -LiteralPath $manifest -PathType Leaf)) {
            throw 'EXP22.4 payload manifest is missing.'
          }
          $verified = 0
          foreach ($line in [IO.File]::ReadAllLines((Resolve-Path $manifest))) {
            if ([string]::IsNullOrWhiteSpace($line)) { continue }
            $parts = $line -split '\s{2,}', 2
            if ($parts.Count -ne 2) { throw "Malformed payload manifest line: $line" }
            $path = $parts[1].Replace('/', [IO.Path]::DirectorySeparatorChar)
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Payload file is missing after extraction: $($parts[1])"
            }
            $fileHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $path).Hash
            if ($fileHash -ne $parts[0]) {
              throw "Payload file hash mismatch: $($parts[1])"
            }
            ++$verified
          }
          if ($verified -ne 29) {
            throw "Payload manifest count mismatch. Expected=29 Actual=$verified"
          }
          Write-Host "EXP22_4_PAYLOAD=PASS SHA256=$actual FILES=$verified"

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Apply exact chain, validate native DXC, build and package
        shell: pwsh
        working-directory: work
        run: ./scripts/build_exp224.ps1 -Configuration '${{ inputs.configuration }}'

      - name: Upload compact game test overlay
        uses: actions/upload-artifact@v4
        with:
          name: DarkWolf-Exp22.4-Native-Hit-Production-Composite-${{ inputs.configuration }}
          path: work/release-rt-reflection-native-composite-exp22_4/**
          if-no-files-found: error
          retention-days: 30
