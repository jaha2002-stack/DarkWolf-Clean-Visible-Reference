name: DarkWolf EXP22.6 Full Production Release from EXP22.5

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/darkwolf-d3d12-full-production-release-exp22_6-from-exp22_5.yml'
      - 'ci/exp22_6/recover_exp224_payload.ps1'
      - 'ci/exp22_6/apply_exact_patch.ps1'
      - 'ci/exp22_6/compile_exp226.ps1'
      - 'ci/exp22_6/package_exp226.ps1'

permissions:
  contents: read

concurrency:
  group: darkwolf-exp22-6-full-production-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 180

    steps:
      - name: Checkout current workflow kit
        uses: actions/checkout@v4
        with:
          repository: jaha2002-stack/DarkWolf-Clean-Visible-Reference
          ref: main
          fetch-depth: 1
          persist-credentials: false
          path: kit

      - name: Checkout exact EXP22.4 donor snapshot
        uses: actions/checkout@v4
        with:
          repository: jaha2002-stack/DarkWolf-Clean-Visible-Reference
          ref: 7a5b93de850c2ac2d172af53ac26923fad9af1cd
          fetch-depth: 1
          persist-credentials: false
          path: donor

      - name: Checkout exact Stable Clear v2.2 source
        uses: actions/checkout@v4
        with:
          repository: jaha2002-stack/DarkWolf-Clean-Visible-Reference
          ref: 229cd5d93b4c24ba705c9821a871cccf31b34b96
          fetch-depth: 1
          persist-credentials: false
          path: work

      - name: Recover and verify the proven EXP22.4 payload
        shell: pwsh
        run: |
          ./kit/ci/exp22_6/recover_exp224_payload.ps1 `
            -DonorRoot "$env:GITHUB_WORKSPACE/donor" `
            -WorkRoot "$env:GITHUB_WORKSPACE/work"

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Rebuild the exact validated chain through EXP22.4
        shell: pwsh
        working-directory: work
        run: ./scripts/build_exp224.ps1 -Configuration 'Release'

      - name: Apply and validate EXP22.6 performance and lifecycle patch
        shell: pwsh
        run: |
          ./kit/ci/exp22_6/apply_exact_patch.ps1 `
            -RepositoryRoot "$env:GITHUB_WORKSPACE/kit" `
            -WorkRoot "$env:GITHUB_WORKSPACE/work"

      - name: Compile EXP22.6 with isolated deterministic project graph
        shell: pwsh
        run: |
          ./kit/ci/exp22_6/compile_exp226.ps1 -WorkRoot "$env:GITHUB_WORKSPACE/work"

      - name: Package complete EXP22.6 Release x64 runtime
        shell: pwsh
        run: |
          ./kit/ci/exp22_6/package_exp226.ps1 -WorkRoot "$env:GITHUB_WORKSPACE/work"

      - name: Upload EXP22.6 failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: DarkWolf-Exp22.6-From-Exp22.5-Failure-Diagnostics
          path: |
            work/ci/exp22_6/SOURCE_CONTRACT_SUMMARY.txt
            work/ci/exp22_6/SOURCE_INPUT_SHA256SUMS.txt
            work/ci/exp22_6/SOURCE_OUTPUT_SHA256SUMS.txt
            work/ci/exp22_6/350-d3d12-performance-lifecycle-exp22_6-exact.patch
            work/ci/exp22_6/EXP22_6_SOURCE_DIFF.patch
            work/ci/exp22_6/BUILD_GRAPH_AUDIT.txt
            work/ci/exp22_6/EXP22_6_COMPILE_MANIFEST.txt
            work/ci/exp22_6/build_logs/**
            work/src/opengl/opengl.h
            work/src/opengl/gl_d3d12raylight.cpp
            work/src/opengl/gl_d3d12shim.cpp
            work/src/renderer/tr_backend.cpp
            work/src/renderer/tr_cmds.cpp
            work/src/renderer/tr_cmesh.cpp
          if-no-files-found: warn
          compression-level: 6
          retention-days: 14

      - name: Upload complete EXP22.6 production game runtime
        uses: actions/upload-artifact@v4
        with:
          name: DarkWolf-Exp22.6-Full-Production-Release
          path: work/release-darkwolf-exp22_6-performance-lifecycle/**
          if-no-files-found: error
          compression-level: 6
          retention-days: 30

      - name: Upload EXP22.6 source audit
        uses: actions/upload-artifact@v4
        with:
          name: DarkWolf-Exp22.6-Source-Audit
          path: |
            work/ci/exp22_6/EXP22_6_SOURCE_DIFF.patch
            work/ci/exp22_6/SOURCE_CONTRACT_SUMMARY.txt
            work/ci/exp22_6/SOURCE_INPUT_SHA256SUMS.txt
            work/ci/exp22_6/SOURCE_OUTPUT_SHA256SUMS.txt
            work/ci/exp22_6/BUILD_GRAPH_AUDIT.txt
            work/ci/exp22_6/EXP22_6_COMPILE_MANIFEST.txt
          if-no-files-found: error
          compression-level: 6
          retention-days: 30
