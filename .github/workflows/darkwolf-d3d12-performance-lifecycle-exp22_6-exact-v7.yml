      - name: Verify the EXP22.6 exact-patch kit
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'

          $manifest = Join-Path $PWD 'kit/ci/exp22_6/EXP22_6_KIT_SHA256SUMS.txt'
          if (-not (Test-Path -LiteralPath $manifest -PathType Leaf)) {
            throw "EXP22.6 exact-patch manifest is missing: $manifest"
          }
          $expectedManifestSha = 'B15C3A9079350E12DDEBDC0EBDEC89262D4491DEF42D9C819D9D41865878E79C'
          $actualManifestSha = (Get-FileHash -Algorithm SHA256 -LiteralPath $manifest).Hash
          if ($actualManifestSha -ne $expectedManifestSha) {
            throw "EXP22.6 kit manifest hash mismatch. Expected=$expectedManifestSha Actual=$actualManifestSha"
          }

          $verified = 0
          foreach ($line in [IO.File]::ReadAllLines((Resolve-Path $manifest))) {
            if ([string]::IsNullOrWhiteSpace($line)) { continue }
            $parts = $line -split '\s{2,}', 2
            if ($parts.Count -ne 2) { throw "Malformed EXP22.6 kit manifest line: $line" }
            $path = Join-Path $PWD (Join-Path 'kit' $parts[1].Replace('/', [IO.Path]::DirectorySeparatorChar))
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "EXP22.6 kit file is missing: $($parts[1])"
            }
            $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $path).Hash
            if ($actual -ne $parts[0]) {
              throw "EXP22.6 kit file hash mismatch: $($parts[1])"
            }
            ++$verified
          }
          if ($verified -ne 13) {
            throw "EXP22.6 kit file count mismatch. Expected=13 Actual=$verified"
          }

          $patch = 'kit/ci/exp22_6/350-d3d12-performance-lifecycle-exp22_6-exact.patch'
          $inputManifest = 'kit/ci/exp22_6/SOURCE_INPUT_SHA256SUMS.txt'
          $outputManifest = 'kit/ci/exp22_6/SOURCE_OUTPUT_SHA256SUMS.txt'
          foreach ($required in @($patch, $inputManifest, $outputManifest)) {
            if (-not (Test-Path -LiteralPath $required -PathType Leaf)) {
              throw "Required exact-patch component is missing: $required"
            }
          }
          $patchPaths = @(git apply --numstat -- $patch | ForEach-Object { ($_ -split "`t", 3)[2] })
          if ($LASTEXITCODE -ne 0) { throw 'Unable to parse EXP22.6 exact patch.' }
          $expectedPaths = @(
            'src/opengl/gl_d3d12raylight.cpp',
            'src/opengl/gl_d3d12shim.cpp',
            'src/opengl/opengl.h',
            'src/renderer/tr_backend.cpp',
            'src/renderer/tr_cmds.cpp',
            'src/renderer/tr_cmesh.cpp'
          ) | Sort-Object
          $actualPaths = @($patchPaths | Sort-Object)
          if (($actualPaths -join '|') -ne ($expectedPaths -join '|')) {
            throw "Exact patch path contract mismatch. Actual=$($actualPaths -join ',')"
          }
          Write-Host "EXP22_6_EXACT_KIT=PASS SHA256=$actualManifestSha FILES=$verified PATCH_PATHS=$($actualPaths.Count)"

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Rebuild the exact validated chain through EXP22.4
        shell: pwsh
        working-directory: work
        run: ./scripts/build_exp224.ps1 -Configuration 'Release'

      - name: Apply and validate the hash-locked EXP22.6 exact patch
        shell: pwsh
        working-directory: work
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'

          $kit = Join-Path $PWD '../kit/ci/exp22_6'
          $patch = Join-Path $kit '350-d3d12-performance-lifecycle-exp22_6-exact.patch'
          $inputManifest = Join-Path $kit 'SOURCE_INPUT_SHA256SUMS.txt'
          $outputManifest = Join-Path $kit 'SOURCE_OUTPUT_SHA256SUMS.txt'
          $sourceFiles = @(
            'src/opengl/opengl.h',
            'src/opengl/gl_d3d12raylight.cpp',
            'src/opengl/gl_d3d12shim.cpp',
            'src/renderer/tr_backend.cpp',
            'src/renderer/tr_cmds.cpp',
            'src/renderer/tr_cmesh.cpp'
          )

          git config core.autocrlf false
          if ($LASTEXITCODE -ne 0) { throw 'Unable to disable Git CRLF conversion for the exact patch stage.' }
          git config core.eol lf
          if ($LASTEXITCODE -ne 0) { throw 'Unable to select LF for the exact patch stage.' }

          # Windows checkout uses CRLF, while the inspected Source Contract and
          # exact patch use canonical LF/no-BOM. Normalize only these six files
          # after the proven EXP22.4 chain has completed. This keeps the donor
          # build unchanged and makes hashes plus patch context deterministic.
          function Convert-ToCanonicalLfNoBom {
            param([Parameter(Mandatory=$true)][string]$Path)

            $resolvedPath = (Resolve-Path -LiteralPath $Path).Path
            [byte[]]$inputBytes = [IO.File]::ReadAllBytes($resolvedPath)
            $start = 0
            $hadBom = $false
            if ($inputBytes.Length -ge 3 -and
                $inputBytes[0] -eq 0xEF -and
                $inputBytes[1] -eq 0xBB -and
                $inputBytes[2] -eq 0xBF) {
              $start = 3
              $hadBom = $true
            }

            $outputBytes = [System.Collections.Generic.List[byte]]::new($inputBytes.Length)
            $crlfCount = 0
            $bareCrCount = 0
            for ($i = $start; $i -lt $inputBytes.Length; ++$i) {
              $value = $inputBytes[$i]
              if ($value -eq 13) {
                if (($i + 1) -lt $inputBytes.Length -and $inputBytes[$i + 1] -eq 10) {
                  ++$crlfCount
                  ++$i
                }
                else {
                  ++$bareCrCount
                }
                $outputBytes.Add([byte]10)
              }
              else {
                $outputBytes.Add($value)
              }
            }

            [IO.File]::WriteAllBytes($resolvedPath, $outputBytes.ToArray())
            $sha = (Get-FileHash -Algorithm SHA256 -LiteralPath $resolvedPath).Hash
            Write-Host "EXP22_6_SOURCE_NORMALIZED $Path CRLF=$crlfCount CR=$bareCrCount BOM=$([int]$hadBom) BYTES=$($outputBytes.Count) SHA256=$sha"
          }

          foreach ($sourceFile in $sourceFiles) {
            if (-not (Test-Path -LiteralPath $sourceFile -PathType Leaf)) {
              throw "Exact source file missing before normalization: $sourceFile"
            }
            Convert-ToCanonicalLfNoBom -Path $sourceFile
          }
          Write-Host 'EXP22_6_SOURCE_NORMALIZATION=PASS MODE=LF_NO_BOM FILES=6'

          function Test-ExactSourceManifest {
            param(
              [Parameter(Mandatory=$true)][string]$Manifest,
              [Parameter(Mandatory=$true)][string]$Phase
            )
            if (-not (Test-Path -LiteralPath $Manifest -PathType Leaf)) {
              throw "$Phase source manifest is missing: $Manifest"
            }
            $verified = 0
            foreach ($line in [IO.File]::ReadAllLines((Resolve-Path $Manifest))) {
              if ([string]::IsNullOrWhiteSpace($line)) { continue }
              $parts = $line -split '\s{2,}', 2
              if ($parts.Count -ne 2) { throw "$Phase malformed source manifest line: $line" }
              $relative = $parts[1].Replace('/', [IO.Path]::DirectorySeparatorChar)
              if (-not (Test-Path -LiteralPath $relative -PathType Leaf)) {
                throw "$Phase source file missing: $($parts[1])"
              }
              $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $relative).Hash
              if ($actual -ne $parts[0]) {
                throw "$Phase source hash mismatch: $($parts[1]) Expected=$($parts[0]) Actual=$actual"
              }
              Write-Host "EXP22_6_SOURCE_${Phase}_SHA256 $actual $($parts[1])"
              ++$verified
            }
            if ($verified -ne 6) { throw "$Phase source manifest count mismatch. Expected=6 Actual=$verified" }
          }

          Test-ExactSourceManifest -Manifest $inputManifest -Phase 'INPUT'
          if (-not (Test-Path -LiteralPath $patch -PathType Leaf)) {
            throw "EXP22.6 exact patch is missing: $patch"
          }

          git add -- $sourceFiles
          if ($LASTEXITCODE -ne 0) { throw 'Unable to stage the exact post-EXP22.4 source snapshot.' }
          git -c user.name='DarkWolf EXP22.6 CI' -c user.email='exp226-ci@localhost' commit --allow-empty --no-gpg-sign -m 'CI snapshot: exact post-EXP22.4 canonical LF source'
          if ($LASTEXITCODE -ne 0) { throw 'Unable to create the local post-EXP22.4 source snapshot.' }

          git apply --check --whitespace=error-all -- $patch
          if ($LASTEXITCODE -ne 0) { throw 'EXP22.6 exact patch pre-apply check failed.' }
          git apply --whitespace=error-all -- $patch
          if ($LASTEXITCODE -ne 0) { throw 'EXP22.6 exact patch application failed.' }
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'EXP22.6 source diff contains whitespace errors.' }
          git apply --reverse --check -- $patch
          if ($LASTEXITCODE -ne 0) { throw 'EXP22.6 reverse patch verification failed.' }

          Test-ExactSourceManifest -Manifest $outputManifest -Phase 'OUTPUT'

          $diff = git diff -- $sourceFiles
          $diffText = $diff -join "`n"
          if ([string]::IsNullOrWhiteSpace($diffText)) {
            throw 'EXP22.6 exact patch produced no source diff.'
          }
          [IO.File]::WriteAllText(
            (Join-Path $PWD 'EXP22_6_SOURCE_DIFF.patch'),
            ($diffText + "`n"),
            [Text.UTF8Encoding]::new($false)
          )
          Copy-Item -LiteralPath $inputManifest -Destination (Join-Path $PWD 'EXP22_6_SOURCE_INPUT_SHA256SUMS.txt') -Force
          Copy-Item -LiteralPath $outputManifest -Destination (Join-Path $PWD 'EXP22_6_SOURCE_OUTPUT_SHA256SUMS.txt') -Force
          Copy-Item -LiteralPath (Join-Path $kit 'SOURCE_CONTRACT_SUMMARY.txt') -Destination (Join-Path $PWD 'EXP22_6_SOURCE_CONTRACT.txt') -Force

          $requiredMarkers = @(
            @{ Path='src/opengl/gl_d3d12raylight.cpp'; Marker='int glRaytracingPrepareHitSurfaceResources(void)' },
            @{ Path='src/opengl/gl_d3d12raylight.cpp'; Marker='static int glRaytracingLightingBuildHitTable(void)' },
            @{ Path='src/opengl/gl_d3d12raylight.cpp'; Marker='glRaytracingExp226TouchInstance' },
            @{ Path='src/opengl/gl_d3d12raylight.cpp'; Marker='minimal shadow-compatible SBT' },
            @{ Path='src/opengl/gl_d3d12raylight.cpp'; Marker='bindingDataChanged' },
            @{ Path='src/opengl/gl_d3d12shim.cpp'; Marker='D3D12_QUERY_HEAP_TYPE_TIMESTAMP' },
            @{ Path='src/renderer/tr_backend.cpp'; Marker='glRaytracingExp226TouchInstance' },
            @{ Path='src/renderer/tr_cmds.cpp'; Marker='EXP22_6_PERF avgFps=' },
            @{ Path='src/renderer/tr_cmesh.cpp'; Marker='EXP22_6_MODEL_FRAME_WRAP' }
          )
          foreach ($check in $requiredMarkers) {
            $body = [IO.File]::ReadAllText((Resolve-Path $check.Path))
            if (-not $body.Contains($check.Marker)) {
              throw "EXP22.6 required marker missing: $($check.Path) :: $($check.Marker)"
            }
          }
          $patchSha = (Get-FileHash -Algorithm SHA256 -LiteralPath $patch).Hash
          Write-Host "EXP22_6_EXACT_PATCH=PASS SHA256=$patchSha"
          Write-Host 'EXP22_6_SOURCE_AUDIT=PASS'

      - name: Rebuild EXP22.6 WolfSP Release x64
        shell: pwsh
        working-directory: work
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'

          $project = Join-Path $PWD 'src/wolf.vcxproj'
          if (-not (Test-Path -LiteralPath $project -PathType Leaf)) {
            throw "WolfSP project is missing: $project"
          }
          $projectText = [IO.File]::ReadAllText((Resolve-Path $project))
          if (-not $projectText.Contains('<OutputFile>../WolfSP.exe</OutputFile>')) {
            throw 'Release x64 WolfSP output contract changed; expected ../WolfSP.exe.'
          }

          # Remove the exact Release x64 output before MSBuild. This prevents a
          # stale repository binary from ever satisfying the post-build check.
          $rebuiltPath = Join-Path $PWD 'WolfSP.exe'
          if (Test-Path -LiteralPath $rebuiltPath) {
            Remove-Item -LiteralPath $rebuiltPath -Force
          }

          $msbuild = (Get-Command msbuild.exe -ErrorAction Stop).Source
          & $msbuild $project '/t:Rebuild' '/p:Configuration=Release' '/p:Platform=x64' '/m' '/verbosity:minimal'
          if ($LASTEXITCODE -ne 0) {
            throw "EXP22.6 WolfSP Release x64 build failed: $LASTEXITCODE"
          }
          if (-not (Test-Path -LiteralPath $rebuiltPath -PathType Leaf)) {
            throw "EXP22.6 build completed without the exact Release x64 output: $rebuiltPath"
          }

          $rebuilt = Get-Item -LiteralPath $rebuiltPath
          if ($rebuilt.Length -lt 1MB) {
            throw "Rebuilt WolfSP.exe is unexpectedly small: $($rebuilt.FullName) $($rebuilt.Length)"
          }

          $sourceRelease = Join-Path $PWD 'release-rt-reflection-native-composite-exp22_4'
          if (-not (Test-Path -LiteralPath $sourceRelease -PathType Container)) {
            throw "EXP22.4 release directory is missing before EXP22.6 packaging: $sourceRelease"
          }
          Copy-Item -LiteralPath $rebuilt.FullName -Destination (Join-Path $sourceRelease 'WolfSP.exe') -Force
          $sha = (Get-FileHash -Algorithm SHA256 -LiteralPath (Join-Path $sourceRelease 'WolfSP.exe')).Hash
          Write-Host "EXP22_6_WOLFSP_BUILD=PASS SOURCE=$($rebuilt.FullName) SHA256=$sha"

      - name: Rebuild and verify exact Release x64 VM modules
        shell: pwsh
        working-directory: work
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'

          $msbuildCommand = Get-Command msbuild.exe -ErrorAction Stop
          $msbuild = $msbuildCommand.Source

          $releaseOutputs = [ordered]@{
            'src/cgame/cgame.vcxproj' = 'main/cgamex64.dll'
            'src/game/game.vcxproj'   = 'main/qagamex64.dll'
            'src/ui/ui.vcxproj'       = 'main/uix64.dll'
          }

          # Remove only the exact Release outputs so a stale repository binary can
          # never satisfy the package audit. Debug *_d.dll files may remain in the
          # checkout, but they are explicitly forbidden from the final artifact.
          foreach ($output in $releaseOutputs.Values) {
            if (Test-Path -LiteralPath $output) {
              Remove-Item -LiteralPath $output -Force
            }
          }

          function Invoke-ReleaseVmBuild {
            param(
              [Parameter(Mandatory=$true)][string]$Project,
              [switch]$AllowSingleRetry
            )

            $arguments = @(
              $Project,
              '/t:Build',
              '/p:Configuration=Release',
              '/p:Platform=x64',
              '/p:BuildProjectReferences=false',
              '/m',
              '/verbosity:minimal'
            )

            & $msbuild @arguments
            $firstExit = $LASTEXITCODE
            if ($firstExit -eq 0) { return }

            if (-not $AllowSingleRetry) {
              throw "Release x64 VM build failed: Project=$Project ExitCode=$firstExit"
            }

            Write-Warning "First Release x64 VM build failed for $Project. Retrying once after generated-table update."
            & $msbuild @arguments
            if ($LASTEXITCODE -ne 0) {
              throw "Release x64 VM build failed after retry: Project=$Project ExitCode=$LASTEXITCODE"
            }
          }

          Invoke-ReleaseVmBuild -Project 'src/cgame/cgame.vcxproj'
          Invoke-ReleaseVmBuild -Project 'src/ui/ui.vcxproj'
          Invoke-ReleaseVmBuild -Project 'src/game/game.vcxproj' -AllowSingleRetry

          foreach ($entry in $releaseOutputs.GetEnumerator()) {
            $output = $entry.Value
            if (-not (Test-Path -LiteralPath $output -PathType Leaf)) {
              throw "Exact Release x64 VM output is missing: $output"
            }
            $item = Get-Item -LiteralPath $output
            if ($item.Name -match '_d\.dll$') {
              throw "Debug VM module cannot be used in production: $($item.FullName)"
            }
            if ($item.Length -lt 524288) {
              throw "Release VM module is unexpectedly small: $($item.FullName) Size=$($item.Length)"
            }
            Write-Host "RELEASE_VM_MODULE $($item.Name) $($item.Length) SOURCE=$($item.FullName)"
          }

          Write-Host 'EXP22_6_RELEASE_VM_BUILD=PASS'

      - name: Create complete production runtime release
        shell: pwsh
        working-directory: work
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'

          $sourceRelease = Join-Path $PWD 'release-rt-reflection-native-composite-exp22_4'
          $sourceExe = Join-Path $sourceRelease 'WolfSP.exe'
          if (-not (Test-Path -LiteralPath $sourceExe -PathType Leaf)) {
            throw "EXP22.4 build completed without the expected WolfSP.exe: $sourceExe"
          }

          $release = Join-Path $PWD 'release-darkwolf-exp22_6-performance-lifecycle'
          if (Test-Path -LiteralPath $release) {
            Remove-Item -LiteralPath $release -Recurse -Force
          }
          $mainDir = Join-Path $release 'main'
          New-Item -ItemType Directory -Path $mainDir -Force | Out-Null

          Copy-Item -LiteralPath $sourceExe -Destination (Join-Path $release 'WolfSP.exe') -Force

          # Copy every runtime DLL stored at the canonical repository root. This
          # preserves OpenAL, DXC/DXIL, D3D12 Agility and NVIDIA/Streamline files
          # without relying on a fragile hand-maintained optional-file list.
          $vmNameRegex = '^(cgamex64|qagamex64|uix64).*\.dll$'
          $rootRuntimeDlls = @(
            Get-ChildItem -LiteralPath $PWD -File -Filter '*.dll' |
              Where-Object { $_.Name -notmatch $vmNameRegex } |
              Sort-Object Name
          )
          if ($rootRuntimeDlls.Count -eq 0) {
            throw 'No root runtime DLLs were found in the exact source checkout.'
          }
          foreach ($dll in $rootRuntimeDlls) {
            Copy-Item -LiteralPath $dll.FullName -Destination (Join-Path $release $dll.Name) -Force
            Write-Host "ROOT_RUNTIME_DLL $($dll.Name) $($dll.Length)"
          }

          # These four files were required by the last known complete DarkWolf
          # runtime package and must never silently disappear from production.
          $requiredRootRuntime = @(
            'OpenAL32.dll',
            'dxcompiler.dll',
            'dxil.dll',
            'sl.interposer.dll'
          )
          foreach ($required in $requiredRootRuntime) {
            if (-not (Test-Path -LiteralPath (Join-Path $release $required) -PathType Leaf)) {
              throw "Required production runtime file was not packaged: $required"
            }
          }

          # Package only the exact Release x64 VM outputs. Wildcards are not
          # permitted here because they previously selected stale *_d.dll binaries.
          $releaseVmNames = @(
            'cgamex64.dll',
            'qagamex64.dll',
            'uix64.dll'
          )
          foreach ($vmName in $releaseVmNames) {
            $sourceVm = Join-Path $PWD (Join-Path 'main' $vmName)
            if (-not (Test-Path -LiteralPath $sourceVm -PathType Leaf)) {
              throw "Exact Release VM module is missing before packaging: $sourceVm"
            }
            $selected = Get-Item -LiteralPath $sourceVm
            Copy-Item -LiteralPath $selected.FullName -Destination (Join-Path $mainDir $selected.Name) -Force
            Write-Host "MAIN_VM_DLL $($selected.Name) $($selected.Length) SOURCE=$($selected.FullName)"
          }

          $debugVmFiles = @(
            Get-ChildItem -LiteralPath $mainDir -File -Filter '*x64_d.dll' -ErrorAction SilentlyContinue
          )
          if ($debugVmFiles.Count -ne 0) {
            throw "Debug VM modules leaked into production: $($debugVmFiles.Name -join ', ')"
          }

          $utf8NoBom = [Text.UTF8Encoding]::new($false)
          $exp226Kit = Join-Path $PWD '../kit/ci/exp22_6'
          $cfgName = 'darkwolf_exp22_6_production.cfg'
          $cfgSource = Join-Path $exp226Kit $cfgName
          if (-not (Test-Path -LiteralPath $cfgSource -PathType Leaf)) {
            throw "EXP22.6 production profile missing: $cfgSource"
          }
          Copy-Item -LiteralPath $cfgSource -Destination (Join-Path $mainDir $cfgName) -Force

          $testToolDir = Join-Path $release 'exp22_6_tests'
          $testCfgDir = Join-Path $mainDir 'exp22_6_tests'
          New-Item -ItemType Directory -Path $testToolDir -Force | Out-Null
          New-Item -ItemType Directory -Path $testCfgDir -Force | Out-Null

          $testCfgFiles = @(
            '01_compression_off.cfg',
            '02_compression_on.cfg',
            '03_reflections_off.cfg',
            '04_dxr_off.cfg'
          )
          foreach ($testFile in $testCfgFiles) {
            $testSource = Join-Path $exp226Kit $testFile
            if (-not (Test-Path -LiteralPath $testSource -PathType Leaf)) {
              throw "EXP22.6 test config missing: $testSource"
            }
            Copy-Item -LiteralPath $testSource -Destination (Join-Path $testCfgDir $testFile) -Force
          }

          $testToolFiles = @(
            'RUN_EXP22_6_PRODUCTION.bat',
            'RUN_EXP22_6_TESTS.bat',
            'RUN_WITHOUT_4K_PACKS.ps1',
            'EXP22_6_COLLECT_RESULTS.ps1'
          )
          foreach ($testFile in $testToolFiles) {
            $testSource = Join-Path $exp226Kit $testFile
            if (-not (Test-Path -LiteralPath $testSource -PathType Leaf)) {
              throw "EXP22.6 test tool missing: $testSource"
            }
            Copy-Item -LiteralPath $testSource -Destination (Join-Path $testToolDir $testFile) -Force
          }

          $launcherName = 'RUN_DARKWOLF_EXP22_6_PRODUCTION.bat'
          $launcherLines = @(
            '@echo off',
            'setlocal',
            'cd /d "%~dp0"',
            'echo Starting DarkWolf EXP22.6 Performance and Lifecycle Release...',
            "WolfSP.exe +set r_dxr 1 +exec $cfgName",
            'endlocal'
          )
          [IO.File]::WriteAllText(
            (Join-Path $release $launcherName),
            (($launcherLines -join "`r`n") + "`r`n"),
            [Text.Encoding]::ASCII
          )

          $exeSha = (Get-FileHash -Algorithm SHA256 -LiteralPath (Join-Path $release 'WolfSP.exe')).Hash
          $sourceDiffSha = (Get-FileHash -Algorithm SHA256 -LiteralPath (Join-Path $PWD 'EXP22_6_SOURCE_DIFF.patch')).Hash
          $readme = @"
          DarkWolf Experiment 22.6 - Performance and Lifecycle Release
          ==================================================

          This is the complete engine/runtime package, not the earlier compact overlay.

          Included:
          - WolfSP.exe built from the exact validated chain through EXP22.4;
          - all runtime DLL files stored at the canonical repository root;
          - freshly built cgamex64, qagamex64 and uix64 modules in main;
          - the accepted EXP22.4 F8 material-balanced production profile;
          - launcher, build manifest and SHA-256 file manifest.

          Start:
            $launcherName

          The archive intentionally does not contain original commercial RTCW PK3 game data.
          If your existing game installation contains original PK3 files, keep them in main.

          EXP20 stabilization compiled into WolfSP.exe:
          - selection mode: 2
          - hysteresis: 0.25
          - minimum hold: 12 frames

          Performance synchronization:
          - r_finish: 0
          - r_dxrCpuSync: 0
          - true D3D12 GPU timestamp telemetry enabled

          Production reflection profile:
          - diagnostic mode: 0
          - material specular mode: 5
          - reflection mode: 5
          - reflection strength: 0.75
          - maximum distance: 700
          - roughness scale: 1.00
          - legacy blend: 0.55

          WolfSP.exe SHA-256: $exeSha
          EXP22.6 exact-patch source diff SHA-256: $sourceDiffSha
          Canonical base: 229cd5d93b4c24ba705c9821a871cccf31b34b96
          EXP22.4 donor snapshot commit: 7a5b93de850c2ac2d172af53ac26923fad9af1cd
          EXP22.4 donor workflow SHA-256: DB30552F3B2663A41892CDD434370A58F468F82C1A5229358E14E09BE2425D0A
          EXP22.4 payload SHA-256: 2B2A7C867CDA10D6324AC114F0F5F9AEE05D20FAA50341F417F7C87A6330D393
          "@
          [IO.File]::WriteAllText(
            (Join-Path $release 'README_EXP22_6_PERFORMANCE_LIFECYCLE_RU.txt'),
            ($readme.Trim() + "`r`n"),
            $utf8NoBom
          )

          $manifest = @"
          DARKWOLF_EXP22_6_PERFORMANCE_LIFECYCLE_RELEASE
          Configuration=Release
          CanonicalBase=229cd5d93b4c24ba705c9821a871cccf31b34b96
          DonorSnapshotCommit=7a5b93de850c2ac2d172af53ac26923fad9af1cd
          DonorWorkflowSHA256=DB30552F3B2663A41892CDD434370A58F468F82C1A5229358E14E09BE2425D0A
          PayloadSHA256=2B2A7C867CDA10D6324AC114F0F5F9AEE05D20FAA50341F417F7C87A6330D393
          EXP20_SelectionMode=2
          EXP20_Hysteresis=0.25
          EXP20_HoldFrames=12
          EXP21_Included=0
          EXP22_Included=1
          EXP22_1_DiagnosticCodeIncluded=1
          EXP22_2_DirectNativeHitColourIncluded=1
          EXP22_3_HitSurfaceBindingRepairIncluded=1
          EXP22_4_BoundedProductionCompositeIncluded=1
          EXP22_5_Profile=F8_MATERIAL_BALANCED
          EXP22_6_Instrumentation=1
          EXP22_6_ExactHashLockedPatch=1
          EXP22_6_BindingCache=1
          EXP22_6_LifecycleCompaction=1
          EXP22_6_GpuTimestampQueries=1
          EXP22_6_VramTelemetry=1
          EXP22_6_ModelFrameWrap=1
          ReflectionMode=5
          ReflectionStrength=0.75
          ReflectionMaxDistance=700
          ReflectionRoughnessScale=1.00
          LegacyBlend=0.55
          PackageType=FULL_ENGINE_RUNTIME
          OriginalCommercialPK3Included=0
          WolfSP_SHA256=$exeSha
          EXP22_6_ExactPatchSourceDiffSHA256=$sourceDiffSha
          "@
          [IO.File]::WriteAllText(
            (Join-Path $release 'BUILD_MANIFEST.txt'),
            ($manifest.Trim() + "`r`n"),
            $utf8NoBom
          )

          # Reject build products and sources that must never leak into a runtime artifact.
          $forbiddenExtensions = @('.pdb', '.obj', '.lib', '.exp', '.ilk', '.vcxproj', '.sln', '.patch', '.py')
          $allowedRuntimePs1 = @('RUN_WITHOUT_4K_PACKS.ps1', 'EXP22_6_COLLECT_RESULTS.ps1')
          $forbidden = @(
            Get-ChildItem -LiteralPath $release -Recurse -File |
              Where-Object {
                $_.Extension.ToLowerInvariant() -in $forbiddenExtensions -or
                ($_.Extension.ToLowerInvariant() -eq '.ps1' -and $_.Name -notin $allowedRuntimePs1)
              }
          )
          if ($forbidden.Count -ne 0) {
            throw "Forbidden non-runtime files found: $($forbidden.FullName -join ', ')"
          }

          foreach ($requiredMainName in @('cgamex64.dll', 'qagamex64.dll', 'uix64.dll')) {
            $requiredMainPath = Join-Path $mainDir $requiredMainName
            if (-not (Test-Path -LiteralPath $requiredMainPath -PathType Leaf)) {
              throw "Required Release main module is missing: $requiredMainName"
            }
          }
          $unexpectedVmModules = @(
            Get-ChildItem -LiteralPath $mainDir -File -Filter '*x64*.dll' |
              Where-Object { $_.Name -notin @('cgamex64.dll', 'qagamex64.dll', 'uix64.dll') }
          )
          if ($unexpectedVmModules.Count -ne 0) {
            throw "Unexpected or Debug VM modules found: $($unexpectedVmModules.Name -join ', ')"
          }

          $filesBeforeSums = @(Get-ChildItem -LiteralPath $release -Recurse -File | Sort-Object FullName)
          $sumLines = foreach ($file in $filesBeforeSums) {
            $relative = $file.FullName.Substring($release.Length).TrimStart('\', '/').Replace('\', '/')
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $file.FullName).Hash.ToLowerInvariant()
            "$hash  $relative"
          }
          [IO.File]::WriteAllText(
            (Join-Path $release 'SHA256SUMS.txt'),
            (($sumLines -join "`r`n") + "`r`n"),
            $utf8NoBom
          )

          $finalFiles = @(Get-ChildItem -LiteralPath $release -Recurse -File | Sort-Object FullName)
          $totalBytes = [int64](($finalFiles | Measure-Object -Property Length -Sum).Sum)
          $totalMiB = [math]::Round($totalBytes / 1MB, 2)

          # The often-quoted ~57 MiB is the compressed GitHub artifact size.
          # The directory itself is expected to be about 124 MiB because the
          # production package contains DLSS, DLSSD, DLSS-G, DXC/DXIL and
          # Streamline runtime DLLs. Validate the uncompressed package separately.
          if ($totalBytes -lt 100MB) {
            throw "Full production runtime is unexpectedly small: $totalMiB MiB. DLSS/Streamline DLLs or main modules may be missing."
          }
          if ($totalBytes -gt 160MB) {
            throw "Full production runtime is unexpectedly large: $totalMiB MiB. Non-runtime files may have been included."
          }

          # Produce a temporary compressed-size audit without nesting a ZIP in the
          # downloadable artifact. upload-artifact performs its own compression.
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $auditZip = Join-Path $env:RUNNER_TEMP 'DarkWolf-Exp22.6-Performance-Lifecycle-Release-audit.zip'
          if (Test-Path -LiteralPath $auditZip) {
            Remove-Item -LiteralPath $auditZip -Force
          }
          [IO.Compression.ZipFile]::CreateFromDirectory(
            $release,
            $auditZip,
            [IO.Compression.CompressionLevel]::Optimal,
            $false
          )
          $compressedBytes = (Get-Item -LiteralPath $auditZip).Length
          $compressedMiB = [math]::Round($compressedBytes / 1MB, 2)
          Write-Host "EXP22_6_COMPRESSED_SIZE_AUDIT BYTES=$compressedBytes MIB=$compressedMiB"
          if ($compressedBytes -lt 30MB -or $compressedBytes -gt 90MB) {
            Write-Warning "Compressed-size audit is outside the expected broad range: $compressedMiB MiB"
          }

          $contentsLines = foreach ($file in $finalFiles) {
            $relative = $file.FullName.Substring($release.Length).TrimStart('\', '/').Replace('\', '/')
            '{0,12}  {1}' -f $file.Length, $relative
          }
          [IO.File]::WriteAllText(
            (Join-Path $release 'FULL_RELEASE_CONTENTS.txt'),
            ((@("TOTAL_BYTES=$totalBytes", "TOTAL_MIB=$totalMiB", '') + $contentsLines) -join "`r`n") + "`r`n",
            $utf8NoBom
          )

          Write-Host "EXP22_6_FULL_PRODUCTION_PACKAGE=PASS FILES=$($finalFiles.Count) TOTAL_BYTES=$totalBytes TOTAL_MIB=$totalMiB COMPRESSED_AUDIT_MIB=$compressedMiB WolfSP_SHA256=$exeSha SOURCE_DIFF_SHA256=$sourceDiffSha"
          foreach ($file in $finalFiles) {
            $relative = $file.FullName.Substring($release.Length).TrimStart('\', '/').Replace('\', '/')
            Write-Host ("ARTIFACT_FILE {0} {1}" -f $file.Length, $relative)
          }

      - name: Upload EXP22.6 failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: DarkWolf-Exp22.6-Exact-Patch-v7-Failure-Diagnostics
          path: |
            kit/ci/exp22_6/SOURCE_CONTRACT_SUMMARY.txt
            kit/ci/exp22_6/SOURCE_INPUT_SHA256SUMS.txt
            kit/ci/exp22_6/SOURCE_OUTPUT_SHA256SUMS.txt
            kit/ci/exp22_6/350-d3d12-performance-lifecycle-exp22_6-exact.patch
            work/EXP22_6_SOURCE_CONTRACT.txt
            work/EXP22_6_SOURCE_INPUT_SHA256SUMS.txt
            work/EXP22_6_SOURCE_OUTPUT_SHA256SUMS.txt
            work/EXP22_6_SOURCE_DIFF.patch
            work/src/opengl/opengl.h
            work/src/opengl/gl_d3d12raylight.cpp
            work/src/opengl/gl_d3d12shim.cpp
            work/src/renderer/tr_backend.cpp
            work/src/renderer/tr_cmds.cpp
            work/src/renderer/tr_cmesh.cpp
          if-no-files-found: warn
          compression-level: 6
          retention-days: 14

      - name: Upload complete production game runtime
        uses: actions/upload-artifact@v4
        with:
          name: DarkWolf-Exp22.6-Performance-Lifecycle-Release-v7
          path: work/release-darkwolf-exp22_6-performance-lifecycle/**
          if-no-files-found: error
          compression-level: 6
          retention-days: 30

      - name: Upload EXP22.6 source audit
        uses: actions/upload-artifact@v4
        with:
          name: DarkWolf-Exp22.6-Source-Audit-v7
          path: |
            work/EXP22_6_SOURCE_DIFF.patch
            work/EXP22_6_SOURCE_CONTRACT.txt
            work/EXP22_6_SOURCE_INPUT_SHA256SUMS.txt
            work/EXP22_6_SOURCE_OUTPUT_SHA256SUMS.txt
          if-no-files-found: error
          compression-level: 6
          retention-days: 30
