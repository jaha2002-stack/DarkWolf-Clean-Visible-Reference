name: DarkWolf EXP22.8 Persistent Dynamic SBT Release

on:
  workflow_dispatch:
  push:
    branches:
      - exp22-8-persistent-dynamic-sbt
    paths:
      - '.github/workflows/darkwolf-d3d12-persistent-dynamic-sbt-exp22_8.yml'
      - 'ci/exp22_8/**'

permissions:
  contents: read

concurrency:
  group: darkwolf-exp22-8-persistent-sbt-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 180

    steps:
      - name: Checkout exact EXP22.8 workflow kit
        uses: actions/checkout@v4
        with:
          repository: jaha2002-stack/DarkWolf-Clean-Visible-Reference
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          path: kit

      - name: Expand and verify EXP22.8 payload
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Join-Path $env:GITHUB_WORKSPACE 'kit/ci/exp22_8/DarkWolf_EXP22_8_Persistent_Dynamic_SBT_GitHub_Kit.zip'
          $expected = 'F7DEF4E8161FECBE8C35846B6101684074E47D87B800E5F4A6AF8392B26C302C'
          if (-not (Test-Path -LiteralPath $archive -PathType Leaf)) { throw "EXP22.8 payload archive missing: $archive" }
          $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $archive).Hash
          if ($actual -ne $expected) { throw "EXP22.8 payload archive hash mismatch. Expected=$expected Actual=$actual" }
          $payloadRoot = Join-Path $env:RUNNER_TEMP 'darkwolf-exp22_8-payload'
          if (Test-Path -LiteralPath $payloadRoot) { Remove-Item -LiteralPath $payloadRoot -Recurse -Force }
          Expand-Archive -LiteralPath $archive -DestinationPath $payloadRoot -Force
          $source = Join-Path $payloadRoot 'ci/exp22_8'
          $destination = Join-Path $env:GITHUB_WORKSPACE 'kit/ci/exp22_8'
          if (-not (Test-Path -LiteralPath $source -PathType Container)) { throw "EXP22.8 payload content missing: $source" }
          Get-ChildItem -LiteralPath $destination -Force | Where-Object { $_.Name -ne 'DarkWolf_EXP22_8_Persistent_Dynamic_SBT_GitHub_Kit.zip' } | Remove-Item -Recurse -Force
          Copy-Item -LiteralPath (Join-Path $source '*') -Destination $destination -Recurse -Force
          Write-Host "EXP22_8_PAYLOAD=PASS SHA256=$actual"

      - name: Repair and verify EXP22.8 packaging wrapper
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $path = Join-Path $env:GITHUB_WORKSPACE 'kit/ci/exp22_8/package_exp228.ps1'
          if (-not (Test-Path -LiteralPath $path -PathType Leaf)) { throw "EXP22.8 package wrapper missing: $path" }
          $lines = [IO.File]::ReadAllLines((Resolve-Path -LiteralPath $path))
          $bad = 'if ($LASTEXITCODE -ne 0) { throw "EXP22.6 base packager returned exit code $LASTEXITCODE" }'
          $good = 'if (-not $?) { throw "EXP22.6 base packager failed without a terminating exception." }'
          $badIndexes = @()
          $goodCount = 0
          for ($i = 0; $i -lt $lines.Length; ++$i) {
            if ($lines[$i] -eq $bad) { $badIndexes += $i }
            if ($lines[$i] -eq $good) { ++$goodCount }
          }
          if ($badIndexes.Count -eq 1 -and $goodCount -eq 0) {
            $lines[$badIndexes[0]] = $good
            [IO.File]::WriteAllLines($path, $lines, [Text.UTF8Encoding]::new($false))
          }
          elseif ($badIndexes.Count -eq 0 -and $goodCount -eq 1) {
            Write-Host 'EXP22.8 package wrapper was already repaired.'
          }
          else {
            throw "EXP22.8 package wrapper contract mismatch. Bad=$($badIndexes.Count) Good=$goodCount"
          }
          $verify = [IO.File]::ReadAllText((Resolve-Path -LiteralPath $path))
          if ($verify.Contains('$LASTEXITCODE')) { throw 'EXP22.8 package wrapper still contains unsafe LASTEXITCODE access.' }
          if (-not $verify.Contains($good)) { throw 'EXP22.8 package wrapper repaired marker is missing.' }
          Write-Host 'EXP22_8_PACKAGE_WRAPPER=PASS MODE=POWERSHELL_SCRIPT_STATUS'

      - name: Checkout exact EXP22.4 donor snapshot
        uses: actions/checkout@v4
        with:
          repository: jaha2002-stack/DarkWolf-Clean-Visible-Reference
          ref: 7a5b93de850c2ac2d172af53ac26923fad9af1cd
          fetch-depth: 1
          persist-credentials: false
          path: donor

      - name: Checkout exact Stable Clear v2.2 source
        uses: actions/checkout@v4
        with:
          repository: jaha2002-stack/DarkWolf-Clean-Visible-Reference
          ref: 229cd5d93b4c24ba705c9821a871cccf31b34b96
          fetch-depth: 1
          persist-credentials: false
          path: work

      - name: Recover and verify proven EXP22.4 payload
        shell: pwsh
        run: |
          ./kit/ci/exp22_6/recover_exp224_payload.ps1 `
            -DonorRoot "$env:GITHUB_WORKSPACE/donor" `
            -WorkRoot "$env:GITHUB_WORKSPACE/work"

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Rebuild exact validated chain through EXP22.4
        shell: pwsh
        working-directory: work
        run: ./scripts/build_exp224.ps1 -Configuration 'Release'

      - name: Apply and verify EXP22.6 lifecycle baseline
        shell: pwsh
        run: |
          ./kit/ci/exp22_6/apply_exact_patch.ps1 `
            -RepositoryRoot "$env:GITHUB_WORKSPACE/kit" `
            -WorkRoot "$env:GITHUB_WORKSPACE/work"

      - name: Apply and verify EXP22.7 static dynamic incremental baseline
        shell: pwsh
        run: |
          ./kit/ci/exp22_7/apply_exp227.ps1 `
            -RepositoryRoot "$env:GITHUB_WORKSPACE/kit" `
            -WorkRoot "$env:GITHUB_WORKSPACE/work"

      - name: Apply and verify EXP22.8 persistent dynamic SBT patch
        shell: pwsh
        run: |
          ./kit/ci/exp22_8/apply_exp228.ps1 `
            -RepositoryRoot "$env:GITHUB_WORKSPACE/kit" `
            -WorkRoot "$env:GITHUB_WORKSPACE/work"

      - name: Compile EXP22.8 with isolated Release x64 graph
        shell: pwsh
        run: |
          ./kit/ci/exp22_8/compile_exp228.ps1 `
            -RepositoryRoot "$env:GITHUB_WORKSPACE/kit" `
            -WorkRoot "$env:GITHUB_WORKSPACE/work"

      - name: Package complete EXP22.8 runtime
        shell: pwsh
        run: |
          ./kit/ci/exp22_8/package_exp228.ps1 `
            -RepositoryRoot "$env:GITHUB_WORKSPACE/kit" `
            -WorkRoot "$env:GITHUB_WORKSPACE/work"

      - name: Upload EXP22.8 failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: DarkWolf-Exp22.8-Failure-Diagnostics
          path: |
            work/ci/exp22_6/build_logs/**
            work/ci/exp22_6/BUILD_GRAPH_AUDIT.txt
            work/ci/exp22_6/EXP22_6_COMPILE_MANIFEST.txt
            work/ci/exp22_7/**
            work/ci/exp22_8/**
            work/src/opengl/gl_d3d12raylight.cpp
            work/src/opengl/opengl.h
            work/src/renderer/tr_cmds.cpp
            work/src/renderer/tr_backend.cpp
          if-no-files-found: warn
          compression-level: 6
          retention-days: 14

      - name: Upload complete EXP22.8 production runtime
        uses: actions/upload-artifact@v4
        with:
          name: DarkWolf-Exp22.8-Full-Production-Release
          path: work/release-darkwolf-exp22_8-persistent-dynamic-sbt/**
          if-no-files-found: error
          compression-level: 6
          retention-days: 30

      - name: Upload EXP22.8 source audit
        uses: actions/upload-artifact@v4
        with:
          name: DarkWolf-Exp22.8-Source-Audit
          path: |
            work/ci/exp22_8/EXP22_8_SOURCE_DIFF.patch
            work/ci/exp22_8/SOURCE_CONTRACT_SUMMARY.txt
            work/ci/exp22_8/SOURCE_INPUT_SHA256SUMS.txt
            work/ci/exp22_8/SOURCE_OUTPUT_SHA256SUMS.txt
            work/ci/exp22_8/EXP22_8_COMPILE_MANIFEST.txt
            work/ci/exp22_8/PATCH_TRANSPORT_AUDIT.txt
            work/ci/exp22_6/BUILD_GRAPH_AUDIT.txt
          if-no-files-found: error
          compression-level: 6
          retention-days: 30
