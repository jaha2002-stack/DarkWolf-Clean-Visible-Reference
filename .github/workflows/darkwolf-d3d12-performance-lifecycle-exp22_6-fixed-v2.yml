          $payload = $base64 -replace '\s', ''
          [IO.File]::WriteAllBytes($archive, [Convert]::FromBase64String($payload))

          $expectedArchiveSha = '1021FED07A1DCB07A89586AF81981B19EF345237ECB1A5E4C5465D7A20415F96'
          $actualArchiveSha = (Get-FileHash -Algorithm SHA256 -LiteralPath $archive).Hash
