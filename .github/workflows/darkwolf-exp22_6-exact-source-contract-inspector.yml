            if ($parts.Count -ne 2) { throw "Malformed inspector manifest line: $line" }
            $path = Join-Path $PWD (Join-Path 'kit' $parts[1].Replace('/', [IO.Path]::DirectorySeparatorChar))
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) { throw "Inspector file missing: $($parts[1])" }
            $fileSha = (Get-FileHash -Algorithm SHA256 -LiteralPath $path).Hash
            if ($fileSha -ne $parts[0]) { throw "Inspector file hash mismatch: $($parts[1])" }
            ++$verified
          }
          if ($verified -ne 2) { throw "Inspector manifest file count mismatch. Expected=2 Actual=$verified" }
          python -m py_compile 'kit/ci/exp22_6_inspector/inspect_exp224.py'
          if ($LASTEXITCODE -ne 0) { throw "Inspector Python compile failed with exit code $LASTEXITCODE" }
          Write-Host "EXP22_6_INSPECTOR_PAYLOAD=PASS SHA256=$actualSha FILES=$verified"

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Rebuild the exact validated chain through EXP22.4
        shell: pwsh
        working-directory: work
        run: ./scripts/build_exp224.ps1 -Configuration 'Release'

      - name: Capture exact post-EXP22.4 source contract
        shell: pwsh
        working-directory: work
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'

          $out = Join-Path $PWD 'EXP22_6_SOURCE_CONTRACT'
          $inspector = Join-Path $PWD '../kit/ci/exp22_6_inspector/inspect_exp224.py'
          if (-not (Test-Path -LiteralPath $inspector -PathType Leaf)) { throw "Inspector missing: $inspector" }

          python $inspector --root $PWD --out $out
          if ($LASTEXITCODE -ne 0) { throw "Source-contract inspector failed with exit code $LASTEXITCODE" }

          $metadata = @(
            "BASE_COMMIT_EXPECTED=229cd5d93b4c24ba705c9821a871cccf31b34b96",
            "WORK_HEAD=$((git rev-parse HEAD).Trim())",
            "WORK_STATUS_BEGIN",
            ((git status --short) -join "`n"),
            "WORK_STATUS_END",
            "WORK_DIFF_STAT_BEGIN",
            ((git diff --stat) -join "`n"),
            "WORK_DIFF_STAT_END"
          )
          [IO.File]::WriteAllText(
            (Join-Path $out 'GIT_METADATA.txt'),
            (($metadata -join "`r`n") + "`r`n"),
            [Text.UTF8Encoding]::new($false)
          )

          git diff -- src/opengl/opengl.h src/opengl/gl_d3d12raylight.cpp src/opengl/gl_d3d12shim.cpp src/renderer/tr_backend.cpp src/renderer/tr_cmds.cpp src/renderer/tr_cmesh.cpp | Out-File -LiteralPath (Join-Path $out 'POST_EXP22_4_SOURCE_DIFF.patch') -Encoding utf8
          if ($LASTEXITCODE -ne 0) { throw 'Unable to generate post-EXP22.4 source diff.' }

          $required = @(
            'SOURCE_CONTRACT.json',
            'SOURCE_CONTRACT.txt',
            'SOURCE_SHA256SUMS.txt',
            'source/src/opengl/gl_d3d12raylight.cpp',
            'source/src/opengl/gl_d3d12shim.cpp'
          )
          foreach ($relative in $required) {
            $path = Join-Path $out $relative
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) { throw "Inspector output missing: $relative" }
          }

          Get-Content -LiteralPath (Join-Path $out 'SOURCE_CONTRACT.txt') | Select-Object -First 240 | ForEach-Object { Write-Host $_ }
          Write-Host 'EXP22_6_EXACT_POST_EXP224_SOURCE_CAPTURE=PASS'

      - name: Upload exact post-EXP22.4 source contract
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DarkWolf-EXP22.6-Exact-Post-EXP22.4-Source-Contract
          path: work/EXP22_6_SOURCE_CONTRACT/**
          if-no-files-found: warn
          compression-level: 6
          retention-days: 14
